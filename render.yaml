services:
  - type: web
    name: ai-inventory-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: TRUST_PROXY
        value: "1"
      - key: AI_PYTHON_EXECUTABLE
        value: python3
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
